<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
    }

  
    .slideshow-container {
      position: relative;
      width: 600px;
      height: 350px;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    
    .slides-track {
      display: flex;
      width: 300%;
      height: 100%;
      animation: slide 12s infinite linear;
    }


    .slide {
      position: relative;
      width: 33.333%;
      height: 100%;
      overflow: hidden; 
    }


    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                  filter 0.6s ease,
                  box-shadow 0.6s ease;
      filter: brightness(0.9);
    }

    /* --- HOVER EFFECTS --- */

    
    .slideshow-container:hover .slides-track {
      animation-play-state: paused;
    }

    
    .slide:hover img {
      transform: scale(1.12); /* Smooth zoom-in */
      filter: brightness(1.1); /* Subtle highlight */
      cursor: pointer;
    }

    
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      
      
      transform: translateY(100%);
      transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
      opacity: 0;
    }

    .slide:hover .caption {
      transform: translateY(0);
      opacity: 1;
    }

  
    @keyframes slide {
      0%, 28% {
        transform: translateX(0%);
      }
      33%, 61% {
        transform: translateX(-33.333%);
      }
      66%, 94% {
        transform: translateX(-66.666%);
      }
      100% {
        transform: translateX(0%);
      }
    }
  </style>
</head>
<body>
     <div class="slideshow-container">
    <div class="slides-track">
      
      <div class="slide">
        <img src="https://picsum.photos/id/1018/600/350" alt="Mountain View">
        <div class="caption">Majestic Mountain Ranges</div>
      </div>

      <div class="slide">
        <img src="https://picsum.photos/id/1015/600/350" alt="River Valley">
        <div class="caption">Serene River Valley</div>
      </div>

      <div class="slide">
        <img src="https://picsum.photos/id/1019/600/350" alt="Ocean Shore">
        <div class="caption">Calm Ocean Waves</div>
      </div>

    </div>
  </div> 
</body>
</html>
